listen: "127.0.0.1:6666"
# Set false only for trusted local use; api_key may then be omitted.
auth_required: true
api_key: "REPLACE_WITH_A_RANDOM_32_CHARACTER_OR_LONGER_TOKEN"
shell: /bin/sh
additional_paths:
  - /opt/homebrew/bin
  - ~/.local/bin
timeout_seconds: 300
max_output_bytes: 1048576
max_concurrent: 4

# Optional OpenAI Secure MCP Tunnel. CONTROL_PLANE_API_KEY overrides tunnel.api_key.
tunnel:
  enabled: false
  # id: tunnel_REPLACE_WITH_REAL_ID
  # api_key: "sk-REPLACE_WITH_RUNTIME_KEY"
  # organization_id: org-...
  # poll_timeout_seconds: 30
  # poll_deadline_guardrail_seconds: 5
  # reconnect:
  #   initial_delay_seconds: 1
  #   max_delay_seconds: 30

# Optional native tools; uncomment and customize to enable.
# tools:
#   enabled: [shell, file_read, file_write, file_edit, file_info, file_search, file_grep, file_glob, directory_list, batch]
# filesystem:
#   default_workdir: ~/workspace
#   allowed_roots: [~/workspace, /tmp]
#   max_read_bytes: 1048576
#   max_write_bytes: 4194304
#   max_search_results: 200
#   respect_gitignore: true
#   follow_symlinks: false
# batch:
#   max_operations: 16
#   max_parallel: 4
#   max_output_bytes: 262144

# Compact tool logging (arguments may contain secrets; opt in deliberately).
# logging:
#   color: auto
#   level: info
#   tunnel_level: warn
#   log_arguments: true
#   max_argument_bytes: 512

#   log_output: false
#   max_output_bytes: 1024

# Optional outbound proxy (disabled by default).
# proxy:
#   enabled: true
#   url: socks5://127.0.0.1:7891
#   no_proxy: [localhost, 127.0.0.1, '::1']
#   tunnel: true
#   shell: true
