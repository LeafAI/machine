listen: "127.0.0.1:6666"
# Set false only for trusted local use; api_key may then be omitted.
auth_required: true
api_key: "REPLACE_WITH_A_RANDOM_32_CHARACTER_OR_LONGER_TOKEN"
shell: /bin/sh
additional_paths:
  - /opt/homebrew/bin
  - ~/.local/bin
timeout_seconds: 300
max_output_bytes: 1048576
max_concurrent: 4

# Optional OpenAI Secure MCP Tunnel. CONTROL_PLANE_API_KEY overrides tunnel.api_key.
tunnel:
  enabled: false
  # id: tunnel_REPLACE_WITH_REAL_ID
  # api_key: "sk-REPLACE_WITH_RUNTIME_KEY"
  # organization_id: org-...

